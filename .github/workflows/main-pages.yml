name: Build and publish NAZ main
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: naz-main-pages
  cancel-in-progress: true
jobs:
  test-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Build
        run: npm run build
      - name: Check responsive layout and intro transition in Chromium, Firefox, WebKit
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium firefox webkit
          mkdir -p .qa-server
          ln -s "$PWD/dist" .qa-server/naz-nail-lounge
          python3 -m http.server 4321 --directory .qa-server > /tmp/naz-qa.log 2>&1 &
          for i in {1..30}; do curl -fsS http://127.0.0.1:4321/naz-nail-lounge/ >/dev/null && break; sleep 1; done
          node tests/header-scroll.mjs
          node tests/intro-transition.mjs
          node tests/atmosphere-mobile.mjs
      - name: Publish to GitHub Pages
        if: github.event_name != 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          keep_files: true
          enable_jekyll: false
          commit_message: 'Update header and booking CTA from main'
